name: Release

# On a vX.Y.Z tag: gate on the full test suite (ci.yml as a `needs:` job), then
# compile the worker into a standalone Bun executable for every DuckDB platform and
# attach the signed, attested archives to the GitHub Release (shared ts-release.yml).
# `bun build --compile` bundles the github:-sourced shared libs (@vgi-azure/graph-core,
# @vgi-azure/node-auth) into the binary, so it boots standalone with no node_modules.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-status:
    # A release tag usually points at a commit whose push to main already passed CI.
    # Reuse that result instead of running the whole CI matrix again; otherwise run CI below.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" --jq .total_count || echo 0)
          echo "ci.yml successes for ${GITHUB_SHA}: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: [ci-status]
    if: ${{ needs.ci-status.outputs.passed != 'true' }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/ts-release.yml@main
    secrets: inherit
    with:
      bin: vgi-azure-defender-worker
      entry: src/worker.ts
      version_check_cmd: ci/check-version.sh
